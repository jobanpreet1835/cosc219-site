<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trail Finder — COSC 219 Lab 9</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <script type="module" src="main.js"></script>
</head>
<body>

    <!-- Collapsing navbar -->
    <nav class="navbar navbar-expand-md navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Trail Finder</a>

            <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#navbarMenu"
                    aria-controls="navbarMenu"
                    aria-expanded="false"
                    aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarMenu">
                <ul class="navbar-nav">
                    <li class="nav-item">
                        <a class="nav-link" href="index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="check.html">Self-check</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main content -->
    <main class="container py-4">
        <h1>Trail Finder</h1>
        <p>Find and explore local trails.</p>

        <!-- Search and rating controls -->
        <div class="row g-3 align-items-end mb-4">

            <div class="col-12 col-md-6">
                <label for="search" class="form-label">Search trails</label>
                <input type="text" id="search"
                       class="form-control"
                       placeholder="Enter trail name">
            </div>

            <div class="col-12 col-md-4">
                <label for="rating" class="form-label">Rating</label>
                <select id="rating" class="form-select">
                    <option value="">All ratings</option>
                    <option value="easy">Easy</option>
                    <option value="moderate">Moderate</option>
                    <option value="hard">Hard</option>
                </select>
            </div>

            <div class="col-12 col-md-2">
                <button id="load-btn" class="btn btn-primary w-100"
                        type="button">
                    Load
                </button>
            </div>
        </div>

        <!-- Loading state -->
        <div id="state-loading" class="text-center">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">Loading trails...</span>
            </div>
        </div>

        <!-- Error state -->
        <div id="state-error" class="alert alert-danger d-none"
             role="alert">
            Unable to load trails.
        </div>

        <!-- Empty state -->
        <div id="state-empty" class="alert alert-info d-none">
            No trails found.
        </div>

        <!-- Loaded state -->
        <div id="state-loaded"
             class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-3 d-none">
        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
